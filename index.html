<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFF8F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="튼튼이">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>튼튼이 만나러 가는 길</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<main id="main">

  <!-- 홈: NOW -->
  <section class="page on" id="p-home"><div class="home" id="home"></div></section>

  <!-- 단계 덱들 -->
  <section class="page" id="p-pack"></section>
  <section class="page" id="p-life"></section>
  <section class="page" id="p-care"></section>
  <section class="page" id="p-dad"></section>
  <section class="page" id="p-phase"></section>

  <!-- 기록 -->
  <section class="page" id="p-log"><div class="scroll">
    <div class="pg-h"><span class="pg-t">튼튼이 기록</span><span class="sm">한 번 누르면 지금 시각으로 저장</span></div>
    <div class="loggrid">
      <button class="lb" onclick="logIt('feedL')"><span class="e">🤱</span>수유 왼쪽</button>
      <button class="lb" onclick="logIt('feedR')"><span class="e">🤱</span>수유 오른쪽</button>
      <button class="lb mint" onclick="logIt('bottle')"><span class="e">🍼</span>분유·젖병</button>
      <button class="lb lav" onclick="logIt('pump')"><span class="e">💧</span>유축함</button>
      <button class="lb butter" onclick="logIt('pee')"><span class="e">💛</span>소변 기저귀</button>
      <button class="lb butter" onclick="logIt('poo')"><span class="e">💩</span>대변 기저귀</button>
      <button class="lb sky wide" onclick="logIt('pain')"><span class="e">💊</span>진통제 맞음/먹음</button>
    </div>
    <div class="box2" id="log-since"></div>
    <div class="box2">
      <div class="row sb"><b id="log-day">오늘 기록</b>
        <span><button class="mini" onclick="logDay(-1)" aria-label="이전 날">◀</button> <button class="mini" onclick="logDay(1)" aria-label="다음 날">▶</button></span></div>
      <div id="log-list"></div>
    </div>
    <p class="sm pad">진통제 간격·용량은 꼭 간호사 안내를 따르세요. 이 기록은 "언제 마지막으로 맞았지?"를 기억하기 위한 메모예요.</p>
  </div></section>

</main>

<nav id="nav">
  <button data-p="home" class="on"><span class="e">🏠</span>홈</button>
  <button data-p="pack"><span class="e">🎒</span>준비물</button>
  <button data-p="life"><span class="e">🏥</span>병원생활</button>
  <button data-p="care"><span class="e">🩺</span>회복·질문</button>
  <button data-p="log"><span class="e">🍼</span>기록</button>
  <button data-p="dad"><span class="e">💪</span>남편</button>
</nav>
<div class="toast" id="toast"></div>
</div>
<script src="data.js"></script>
<script src="decks.js"></script>
<script src="app.js"></script>
</body>
</html>
